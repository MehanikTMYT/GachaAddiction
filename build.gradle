plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${neoforged_moddev_version}"
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("**/*.zip")
    exclude("src/generated/**/.cache")
}

// All sources are compiled in every profile. Clavis has no available 26.1.2 source port.
String gachaRuntime = providers.gradleProperty("gachaRuntime").orElse("ported").get()
if (!(gachaRuntime in ["all", "ported", "supported", "core"])) throw new GradleException("Unknown gachaRuntime: " + gachaRuntime)
if (gachaRuntime == "all") throw new GradleException("Clavis is not ported: no source project or 26.1.2 release is available. Use -PgachaRuntime=ported for all available integrations.")
boolean onlyCompile = gachaRuntime == "core"
boolean portedRuntime = gachaRuntime == "ported"
def portedDepsRoot = file(providers.gradleProperty("gachaDepsRoot").orElse("../gacha-deps").get())
def portedJar = { String projectName, String filename -> files(new File(portedDepsRoot, "${projectName}/build/libs/${filename}")) }
def treasureBagsJar = portedJar("Treasure-Bags", "treasurebags-1.10.1+26.1.2-port.jar")
def lootBundlesJar = portedJar("lootbundles", "lootbundles-1.21.1-1.1.1+26.1.2-port.jar")
def colorTooltipsJar = portedJar("ColorTooltips", "colortooltips-1211.3.6+26.1.2-port.jar")
def confluenceJar = portedJar("Confluence-Magic-Lib", "ConfluenceMagicLib-neoforge-0.1.0+26.1.2.jar")

def verifyPortedDependencies = tasks.register('verifyPortedDependencies') {
    def requiredJars = treasureBagsJar + lootBundlesJar + confluenceJar + (portedRuntime ? colorTooltipsJar : files())
    inputs.files(requiredJars)
    doLast {
        requiredJars.each { jar ->
            if (!jar.isFile()) throw new GradleException("Missing dependency port: ${jar}. Build the source projects in ${portedDepsRoot} first; see PORT_STATUS.md.")
        }
    }
}
tasks.named('compileJava').configure { dependsOn verifyPortedDependencies }

tasks.register('stageIntegrationMods', Sync) {
    group = 'verification'
    description = 'Stage Gacha and the selected integration mods for a regular NeoForge installation.'
    dependsOn tasks.named('jar'), verifyPortedDependencies
    into layout.buildDirectory.dir('integration-mods')
    from tasks.named('jar')
    from {
        configurations.runtimeClasspath.files.findAll { artifact ->
            if (!artifact.name.endsWith('.jar') || artifact.name.startsWith('minecraft-') ||
                    artifact.name.startsWith('neoforge-') || artifact.name.startsWith('mixinsquared-')) return false
            new java.util.zip.ZipFile(artifact).withCloseable { zip ->
                zip.getEntry('META-INF/neoforge.mods.toml') != null
            }
        }
    }
}

repositories {
    mavenLocal()

    maven {
        name = "FirstDark"
        url = "https://maven.firstdark.dev/snapshots"
        content { includeGroup "com.lowdragmc.ldlib2" }
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }

    mavenCentral()

    // NeoForge 官方仓库
    maven {
        name = "NeoForged"
        url = "https://neoforged.forgecdn.net/releases"
    }

    maven {
        name = "LatvianMaven" // KubeJS
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }

    maven {
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'noobanidus.mods.lootr'
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }

    maven {
        name = "ModMaven"
        url = uri("https://modmaven.dev")
        content { includeGroup "mezz.jei" }
    }


    maven {
        url = uri("https://www.cursemaven.com")
        content { includeGroup "curse.maven" }
    }

    // MixinSquared
    maven { url = 'https://maven.bawnorton.com/releases'; content { includeGroup 'com.github.bawnorton.mixinsquared' } }

    // JitPack - GitHub 项目打包
    maven {
        url 'https://jitpack.io'
        content { includeGroup "com.github.rtyley" }
    }
    maven {
        name "magicTeam MavenReleases"
        url "https://maven.confluence.ink/releases"
        content { includeGroup "org.confluence.lib" }
    }
    maven {
        name "magicTeam MavenSnapshots"
        url "https://maven.confluence.ink/snapshots"
        content { includeGroup "org.confluence.lib" }
    }

    maven {
        // Shedaniel's maven (Architectury API)
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }

    maven {
        url "https://maven.ftb.dev/releases"
        content {
            includeGroup "dev.ftb.mods"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'info'

            jvmArguments.addAll([
                    "-XX:+IgnoreUnrecognizedVMOptions",
                    "-XX:+AllowEnhancedClassRedefinition"
            ])
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "de.marhali:json5-java:3.0.0"
    compileOnly "com.lowdragmc.ldlib2:ldlib2-neoforge-${ldlib2_minecraft_version}:${ldlib2_version}"
    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:${mixinsquared_version}"))
    implementation(jarJar("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:${mixinsquared_version}"))
    implementation "maven.modrinth:jade:${jade_version}+neoforge"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "maven.modrinth:lootr:${lootr_version}"
    compileOnly "maven.modrinth:raritycore:${raritycore_version}"
    compileOnly "curse.maven:ftb-library-forge-404465:${ftb_library_file}"
    compileOnly "curse.maven:ftb-teams-forge-404468:${ftb_teams_file}"
    compileOnly "curse.maven:ftb-quests-forge-289412:${ftb_quests_file}"
    compileOnly "maven.modrinth:silent-lib:${silentlib_version}"
    compileOnly treasureBagsJar
    compileOnly lootBundlesJar
    compileOnly confluenceJar

    if (!onlyCompile) {
        runtimeOnly "com.lowdragmc.ldlib2:ldlib2-neoforge-${ldlib2_minecraft_version}:${ldlib2_version}"
        runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
        runtimeOnly "maven.modrinth:lootr:${lootr_version}"
        runtimeOnly "maven.modrinth:raritycore:${raritycore_version}"
        runtimeOnly "curse.maven:ftb-library-forge-404465:${ftb_library_file}"
        runtimeOnly "curse.maven:ftb-teams-forge-404468:${ftb_teams_file}"
        runtimeOnly "curse.maven:ftb-quests-forge-289412:${ftb_quests_file}"
        if (portedRuntime) {
            runtimeOnly treasureBagsJar
            runtimeOnly lootBundlesJar
            runtimeOnly colorTooltipsJar
            runtimeOnly confluenceJar
            runtimeOnly "maven.modrinth:silent-lib:${silentlib_version}"
            runtimeOnly "maven.modrinth:kubejs:${kubejs_version}"
            runtimeOnly "maven.modrinth:rhino:${rhino_version}"
            runtimeOnly "maven.modrinth:better-advanced-tooltips:${better_tooltips_version}"
            runtimeOnly "maven.modrinth:architectury-api:${architectury_version}"
            runtimeOnly "maven.modrinth:shatterbyte-lib:${shatterbyte_lib_version}"
            runtimeOnly "curse.maven:ftb-filter-system-943925:${ftb_filter_file}"
            runtimeOnly "curse.maven:ftb-ultimine-forge-386134:${ftb_ultimine_file}"
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
